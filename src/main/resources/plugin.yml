name: LivesSMP
version: '${project.version}'
main: me.sparklee.LivesSMP.LivesSMP
api-version: '1.21'
description: A configurable lives and revival system for SMP servers.
author: Sparklee
website: https://github.com/Sparkleeop/LivesSMP
folia-supported: true

commands:
  livessmp:
    description: LivesSMP main command
    usage: /livessmp [lives|revive|addlives|setlives|removelives|checklives|withdrawlife|toplives|reload]
  revive:
    description: Revive a banned player using a Revive Crystal
    usage: /revive <player>
  lives:
    description: Check your remaining lives
    usage: /lives
  livessmpreload:
    description: Reload the LivesSMP configuration
    usage: /livessmpreload
  addlives:
    description: Add lives to a player
    usage: /addlives <player> <amount>
  setlives:
    description: Set the lives of a player
    usage: /setlives <player> <amount>
  removelives:
    description: Remove lives from a player
    usage: /removelives <player> <amount>
  checklives:
    description: Check another player's lives
    usage: /checklives <player>
  toplives:
    description: Shows the top players with the most lives
    usage: /toplives
  withdrawlife:
    description: Withdraw your lives into a Life Shard item
    usage: /withdrawlife <amount>

permissions:
  livessmp.admin:
    description: Allows managing player lives (add/set/remove) and reloading the plugin
    default: op
  livessmp.bypass:
    description: Prevents life loss and bans from LivesSMP
    default: op
  livessmp.check:
    description: Allows checking other players' lives
    default: op
  livessmp.withdraw:
    description: Allows withdrawing lives into items
    default: true
